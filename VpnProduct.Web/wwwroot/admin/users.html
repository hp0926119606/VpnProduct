<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VpnProduct Users</title>

<style>
body{
    font-family:Arial;
    margin:20px;
}

.menu{
    margin-bottom:20px;
}

table{
    border-collapse:collapse;
    width:100%;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
    font-size:12px;
    vertical-align:top;
}

th{
    background:#f0f0f0;
}

input,select{
    padding:5px;
}

button{
    padding:5px 10px;
    margin:2px;
}

.ok{
    color:green;
    font-weight:bold;
}

.bad{
    color:red;
    font-weight:bold;
}

.small{
    font-size:12px;
}

.search-box{
    position:relative;
    display:inline-block;
}

.suggestions{
    position:absolute;
    background:white;
    border:1px solid #999;
    width:300px;
    max-height:220px;
    overflow-y:auto;
    z-index:999;
    display:none;
}

.suggestion-item{
    padding:7px;
    cursor:pointer;
    font-size:13px;
}

.suggestion-item:hover{
    background:#e8f0fe;
}
</style>

</head>

<body>

<div class="menu">
    <a href="/">首頁</a>
    |
    <a href="/admin/index.html">Admin Dashboard</a>
    |
    <a href="/admin/subscriptions.html">訂閱管理</a>
    |
    <a href="/admin/users.html">使用者管理</a>
</div>

<hr>

<h2>VpnProduct Users Dashboard</h2>

<div>
Admin Token
<input id="token" style="width:220px" type="password">
<button onclick="saveToken()">Save Token</button>
</div>

<br>

<div>
Search Email

<div class="search-box">
    <input id="search"
           style="width:300px"
           autocomplete="off"
           oninput="loadEmailSuggestions()"
           onfocus="loadEmailSuggestions(true)">

    <div id="suggestions" class="suggestions"></div>
</div>

Page Size

<select id="pageSize">
    <option value="50">50</option>
    <option value="100">100</option>
</select>

<button onclick="searchUsers()">Search</button>
<button onclick="clearSearch()">Clear</button>
<button onclick="loadUsers()">Refresh</button>
<button onclick="exportExcel()">匯出 Excel</button>
</div>

<br>

<div id="summary"></div>

<br>

<table>
<thead>
<tr>
    <th>Email</th>
    <th>Email Confirmed</th>
    <th>Subscription</th>
    <th>Expire</th>
    <th>VPN IP</th>
    <th>Public Key</th>
    <th>Peer Active</th>
    <th>Actions</th>
</tr>
</thead>

<tbody id="rows">
</tbody>
</table>

<br>

<button onclick="prevPage()">Prev</button>
<span id="pageInfo"></span>
<button onclick="nextPage()">Next</button>

<pre id="result"></pre>

<script>

let currentPage = 1;
let totalPages = 1;
let suggestTimer = null;

function getToken()
{
    const saved =
        localStorage.getItem("adminToken");

    if(saved)
    {
        document.getElementById("token").value =
            saved;

        return saved;
    }

    return document.getElementById("token").value;
}

function saveToken()
{
    const token =
        document.getElementById("token").value;

    localStorage.setItem("adminToken", token);

    alert("Token saved.");
}

async function loadEmailSuggestions(showAllOnFocus)
{
    clearTimeout(suggestTimer);

    suggestTimer = setTimeout(async function(){

        const token =
            getToken();

        const search =
            document.getElementById("search").value.trim();

        const box =
            document.getElementById("suggestions");

        if(search.length < 1 && !showAllOnFocus)
        {
            box.style.display = "none";
            box.innerHTML = "";
            return;
        }

        const res =
            await fetch(
                "/api/admin/user-emails?search=" +
                encodeURIComponent(search),
                {
                    headers:
                    {
                        "X-Admin-Token": token
                    }
                });

        if(!res.ok)
        {
            box.style.display = "none";
            return;
        }

        const emails =
            await res.json();

        if(emails.length === 0)
        {
            box.style.display = "none";
            box.innerHTML = "";
            return;
        }

        let html = "";

        for(const email of emails)
        {
            html += `
                <div class="suggestion-item"
                     onclick="selectEmail('${email}')">
                    ${email}
                </div>`;
        }

        box.innerHTML =
            html;

        box.style.display =
            "block";

    }, 150);
}

function selectEmail(email)
{
    document.getElementById("search").value =
        email;

    document.getElementById("suggestions").style.display =
        "none";

    currentPage = 1;

    loadUsers();
}

function searchUsers()
{
    currentPage = 1;

    document.getElementById("suggestions").style.display =
        "none";

    loadUsers();
}

function clearSearch()
{
    document.getElementById("search").value = "";
    currentPage = 1;
    loadUsers();
}

function exportExcel()
{
    const token =
        getToken();

    const search =
        document.getElementById("search").value;

    const url =
        "/api/admin/users-export-xlsx?search=" +
        encodeURIComponent(search);

    fetch(url,
    {
        headers:
        {
            "X-Admin-Token": token
        }
    })
    .then(response =>
    {
        if(!response.ok)
        {
            throw new Error("Export failed: " + response.status);
        }

        return response.blob();
    })
    .then(blob =>
    {
        const downloadUrl =
            window.URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href =
            downloadUrl;

        a.download =
            "vpnproduct-users.xlsx";

        document.body.appendChild(a);

        a.click();

        a.remove();

        window.URL.revokeObjectURL(downloadUrl);
    })
    .catch(err =>
    {
        alert(err.message);
    });
}

async function loadUsers()
{
    const token =
        getToken();

    const search =
        document.getElementById("search").value;

    const pageSize =
        document.getElementById("pageSize").value;

    const res =
        await fetch(
            `/api/admin/users?page=${currentPage}&pageSize=${pageSize}&search=${encodeURIComponent(search)}`,
            {
                headers:
                {
                    "X-Admin-Token": token
                }
            });

    if(res.status === 401)
    {
        alert("Unauthorized. Please check admin token.");
        return;
    }

    const data =
        await res.json();

    totalPages =
        data.totalPages;

    document.getElementById("summary").innerText =
        `Total Users: ${data.totalCount}`;

    document.getElementById("pageInfo").innerText =
        `Page ${data.page}/${data.totalPages}`;

    let html = "";

    for(const u of data.data)
    {
        const confirmed =
            u.emailConfirmed
                ? `<span class="ok">Yes</span>`
                : `<span class="bad">No</span>`;

        const sub =
            u.subscriptionActive
                ? `<span class="ok">Active</span>`
                : `<span class="bad">Inactive</span>`;

        const peer =
            u.peerActive
                ? `<span class="ok">Active</span>`
                : `<span class="bad">Inactive</span>`;

        html += `
        <tr>
            <td>${u.email}</td>
            <td>${confirmed}</td>
            <td>${sub}</td>
            <td>${u.subscriptionExpireAtUtc ?? ""}</td>
            <td>${u.assignedIp ?? ""}</td>
            <td class="small">${u.publicKey ?? ""}</td>
            <td>${peer}</td>
            <td>
                <button onclick="extendSub('${u.email}', 30)">
                    延長30天
                </button>

                <button onclick="disableSub('${u.email}')">
                    停權
                </button>

                <button onclick="enableSub('${u.email}', 30)">
                    啟用30天
                </button>
            </td>
        </tr>`;
    }

    document.getElementById("rows").innerHTML =
        html;
}

async function extendSub(email, days)
{
    const token =
        getToken();

    const res =
        await fetch("/api/admin/extend-subscription",
        {
            method:"POST",
            headers:
            {
                "Content-Type":"application/json",
                "X-Admin-Token":token
            },
            body:JSON.stringify(
            {
                userEmail:email,
                days:days
            })
        });

    document.getElementById("result").innerText =
        await res.text();

    await loadUsers();
}

async function disableSub(email)
{
    const token =
        getToken();

    const res =
        await fetch("/api/admin/disable-subscription",
        {
            method:"POST",
            headers:
            {
                "Content-Type":"application/json",
                "X-Admin-Token":token
            },
            body:JSON.stringify(
            {
                userEmail:email
            })
        });

    document.getElementById("result").innerText =
        await res.text();

    await loadUsers();
}

async function enableSub(email, days)
{
    const token =
        getToken();

    const res =
        await fetch("/api/admin/enable-subscription",
        {
            method:"POST",
            headers:
            {
                "Content-Type":"application/json",
                "X-Admin-Token":token
            },
            body:JSON.stringify(
            {
                userEmail:email,
                days:days
            })
        });

    document.getElementById("result").innerText =
        await res.text();

    await loadUsers();
}

function prevPage()
{
    if(currentPage > 1)
    {
        currentPage--;
        loadUsers();
    }
}

function nextPage()
{
    if(currentPage < totalPages)
    {
        currentPage++;
        loadUsers();
    }
}

document.addEventListener("click", function(e){
    const searchBox =
        document.querySelector(".search-box");

    if(!searchBox.contains(e.target))
    {
        document.getElementById("suggestions").style.display =
            "none";
    }
});

getToken();
loadUsers();

</script>

</body>
</html>
